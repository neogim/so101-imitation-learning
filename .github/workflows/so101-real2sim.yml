name: SO101 Real-to-Sim offline tests

on:
  pull_request:
    paths:
      - "scripts/so101_sim/**"
      - "data/urdf/so101/**"
      - ".github/workflows/so101-real2sim.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated simulation dependencies
        run: python -m pip install "mujoco>=3.3,<4" "pyarrow>=16" "pillow>=10" "scipy>=1.11" "opencv-python-headless>=4.8" "gymnasium>=1,<2" "matplotlib>=3.7,<4" "trimesh>=4,<5" "manifold3d>=3,<4"
      - name: Check Python syntax
        run: python -m compileall -q scripts/so101_sim
      - name: Unit and synthetic MuJoCo smoke tests
        run: python -m unittest discover -s scripts/so101_sim -p "test_*.py" -v
